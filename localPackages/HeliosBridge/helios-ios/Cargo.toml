[package]
name = "helios-ios"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
# Helios Ethereum light client (verified consensus + execution)
# Using helios-ethereum directly to avoid pulling in opstack/linea deps
helios-ethereum = { git = "https://github.com/a16z/helios.git", branch = "master" }

# Alloy Ethereum types — must match Helios workspace (alloy 1.0.x)
alloy = { version = "1.0", default-features = false, features = [
    "rpc-types",
    "consensus",
    "network",
] }

# Async runtime
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "macros",
] }

# HTTP client with SOCKS5 proxy support — feature unification ensures
# Helios's internal reqwest also gets the "socks" feature, enabling
# ALL_PROXY env var to route all requests through Tor.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "socks",
    "json",
] }

# Error handling
eyre = "0.6"

# FFI utilities
libc = "0.2"
once_cell = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Hex encoding
hex = "0.4"

# Logging
tracing = "0.1"

[features]
default = []
